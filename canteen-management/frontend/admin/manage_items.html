<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Food Items - Canteen Admin</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <h1>Manage Food Items</h1>
    <nav>
        <ul>
            <li><a href="dashboard.html">Overview</a></li>
            <li><a href="manage_items.html">Manage Food Items</a></li>
            <li><a href="manage_orders.html">Manage Orders</a></li>
        </ul>
    </nav>
    <main class="admin-main-content">
        <h2>Add New Item</h2>
        <form id="addItemForm" class="admin-form">
            <div>
                <label for="itemName">Item Name:</label>
                <input type="text" id="itemName" name="itemName" required>
            </div>
            <div>
                <label for="itemDescription">Description:</label>
                <textarea id="itemDescription" name="itemDescription"></textarea>
            </div>
            <div>
                <label for="itemPrice">Price:</label>
                <input type="number" id="itemPrice" name="itemPrice" step="0.01" required>
            </div>
            <div>
                <label for="itemStock">Stock Quantity:</label>
                <input type="number" id="itemStock" name="itemStock" required>
            </div>
            <button type="submit" class="btn-ui-primary">Add Item</button>
        </form>

        <h2>Existing Items</h2>
        <div id="existingItemsList">
            <!-- Food items will be listed here -->
            <p>Loading items...</p>
        </div>
    </main>
    <script>
        document.getElementById('addItemForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Add item functionality to be implemented!');
            // Logic to send data to backend API
        });
        // Logic to fetch and display existing items will be added later
    </script>
    <script src="../static/js/animations.js" defer></script>
</body>
</html>
