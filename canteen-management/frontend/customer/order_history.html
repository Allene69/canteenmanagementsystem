<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order History - Canteen</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .order { border: 1px solid #ccc; margin-bottom: 20px; padding: 15px; border-radius: 5px; }
        .order h3 { margin-top: 0; }
        .order-items li { margin-bottom: 5px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <h1>Your Order History</h1>
    <nav>
        <a href="menu.html">Back to Menu</a>
    </nav>
    <div id="orderHistoryContainer">
        <p>Loading your order history...</p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            fetchOrderHistory();
        });

        function fetchOrderHistory() {
            // In a real app, the customer ID would come from a logged-in session.
            // We are using a placeholder API that doesn't require auth for now.
            fetch('/api/orders/history') // Assumes the Flask app is running on the same domain/port
                .then(response => {
                    if (!response.ok) {
                        if (response.status === 404) return { orders: [], message: 'No orders found.' };
                        throw new Error('Network response was not ok: ' + response.statusText);
                    }
                    return response.json();
                })
                .then(data => {
                    const container = document.getElementById('orderHistoryContainer');
                    container.innerHTML = ''; // Clear loading message

                    if (data.message) { // Handle cases like "No orders found"
                        container.innerHTML = `<p>\${data.message}</p>`;
                        return;
                    }

                    if (data && data.length > 0) {
                        data.forEach(order => {
                            const orderDiv = document.createElement('div');
                            orderDiv.className = 'order';

                            let itemsHtml = '<ul>';
                            order.items.forEach(item => {
                                itemsHtml += \`<li>\${item.item_name} (Qty: \${item.quantity}) - Price: $\${item.price_at_purchase.toFixed(2)}</li>\`;
                            });
                            itemsHtml += '</ul>';

                            orderDiv.innerHTML = \`
                                <h3>Order ID: \${order.order_id}</h3>
                                <p>Date: \${new Date(order.order_date).toLocaleDateString()}</p>
                                <p>Total Amount: $\${order.total_amount.toFixed(2)}</p>
                                <p>Status: \${order.status}</p>
                                <p>Payment Status: \${order.payment_status}</p>
                                <h4>Items:</h4>
                                \${itemsHtml}
                            \`;
                            container.appendChild(orderDiv);
                        });
                    } else {
                        container.innerHTML = '<p>You have no past orders.</p>';
                    }
                })
                .catch(error => {
                    console.error('Error fetching order history:', error);
                    const container = document.getElementById('orderHistoryContainer');
                    container.innerHTML = '<p>Could not load order history. Please try again later.</p>';
                });
        }
    </script>
    <script src="../static/js/animations.js" defer></script>
</body>
</html>
