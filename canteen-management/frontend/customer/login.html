<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login - Canteen</title>
    <link rel="stylesheet" href="../static/css/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
    <div class="auth-container">
    <h1>Customer Login</h1>
    <form id="loginForm">
        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-ui-primary">Login</button>
    </form>
    <p>Don't have an account? <a href="register.html">Register here</a></p>
    </div> <!-- end auth-container -->
    <script>
        // Basic client-side logic will be added later
        // For now, this is just a placeholder structure
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert('Login functionality to be implemented!');
        });
    </script>
    <script src="../static/js/animations.js" defer></script>
</body>
</html>
